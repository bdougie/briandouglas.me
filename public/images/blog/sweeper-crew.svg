<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">Sweeper fans one repository commit out to a crew</title>
  <desc id="desc">One repository commit enters Sweeper. Pi fans the job out to local Ollama workers on an RTX 5090 and routes difficult puzzles to Kimi K2.6 in the cloud. Every lane returns to lint, test, and diff verification before work advances.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f97316"/>
    </marker>
    <style>
      .canvas { fill: #000; }
      .rule { stroke: #374151; stroke-width: 1.5; }
      .route { fill: none; stroke: #f97316; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #f97316; stroke-width: 2.5; marker-end: url(#arrow); }
      .eyebrow { fill: #fb923c; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.2px; }
      .headline { fill: #fff; font: 600 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #fb923c; font: 600 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #fff; font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #d1d5db; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9ca3af; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #fb923c; font: 600 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect class="canvas" width="720" height="760"/>

  <text class="eyebrow" x="44" y="42">SWEEPER / REPOSITORY FAN-OUT</text>
  <text class="headline" x="44" y="82">One commit. A crew of workers.</text>
  <text class="body" x="44" y="113">Same starting point, different ways to attack the job.</text>
  <line class="rule" x1="44" y1="139" x2="676" y2="139"/>

  <text class="step" x="44" y="190">01</text>
  <text class="label" x="96" y="188">Start from a known state</text>
  <text class="body" x="96" y="217">Every worker receives the same commit and the same evidence.</text>
  <path class="arrow" d="M62 208V258"/>

  <text class="step" x="44" y="291">02</text>
  <text class="label" x="96" y="289">Pi plans the job. Sweeper fans it out.</text>
  <text class="mono" x="676" y="289" text-anchor="end">23 or 238 workers</text>

  <path class="route" d="M62 309V347H206V373"/>
  <path class="route" d="M62 347H514V373"/>
  <path d="M206 365V378" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M514 365V378" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line class="rule" x1="44" y1="390" x2="354" y2="390"/>
  <text class="eyebrow" x="44" y="421">LOCAL / RTX 5090</text>
  <text class="label" x="44" y="457">Ollama</text>
  <text class="body" x="44" y="491">Laguna XS</text>
  <text class="muted" x="170" y="491">routine execution</text>
  <text class="body" x="44" y="523">Qwen 3.8 27B</text>
  <text class="muted" x="206" y="523">navigation + recon</text>

  <line class="rule" x1="386" y1="390" x2="676" y2="390"/>
  <text class="eyebrow" x="386" y="421">CLOUD / AFTER TRIAGE</text>
  <text class="label" x="386" y="457">Kimi K2.6</text>
  <text class="body" x="386" y="491">Hard puzzles only</text>
  <text class="muted" x="386" y="523">More weight when depth matters.</text>

  <path class="route" d="M206 544V579H360"/>
  <path class="route" d="M514 544V579H360"/>
  <path class="arrow" d="M360 579V618"/>

  <line class="rule" x1="44" y1="632" x2="676" y2="632"/>
  <text class="step" x="44" y="676">03</text>
  <text class="label" x="96" y="674">Prove the work</text>
  <text class="mono" x="676" y="674" text-anchor="end">lint  •  test  •  diff</text>
  <text class="body" x="96" y="709">A clean exit is not enough. Only verified changes advance.</text>
  <line x1="96" y1="736" x2="676" y2="736" stroke="#f97316" stroke-width="4"/>
</svg>
