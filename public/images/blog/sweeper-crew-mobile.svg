<svg xmlns="http://www.w3.org/2000/svg" width="390" height="940" viewBox="0 0 390 940" role="img" aria-labelledby="title desc">
  <title id="title">Sweeper fans one repository commit out to a crew</title>
  <desc id="desc">One repository commit enters Sweeper. Pi fans the job out to local Ollama workers on an RTX 5090 and routes difficult puzzles to Kimi K2.6 in the cloud. Every lane returns to lint, test, and diff verification before work advances.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f97316"/>
    </marker>
    <style>
      .canvas { fill: #000; }
      .rule { stroke: #374151; stroke-width: 1.5; }
      .route { fill: none; stroke: #f97316; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #f97316; stroke-width: 2.5; marker-end: url(#arrow); }
      .eyebrow { fill: #fb923c; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.7px; }
      .headline { fill: #fff; font: 600 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #fb923c; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #fff; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #d1d5db; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9ca3af; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #fb923c; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect class="canvas" width="390" height="940"/>

  <text class="eyebrow" x="20" y="32">SWEEPER / REPOSITORY FAN-OUT</text>
  <text class="headline" x="20" y="72">One commit.</text>
  <text class="headline" x="20" y="104">A crew of workers.</text>
  <text class="body" x="20" y="134">Same start, different ways forward.</text>
  <line class="rule" x1="20" y1="158" x2="370" y2="158"/>

  <text class="step" x="20" y="199">01</text>
  <text class="label" x="62" y="198">Known state</text>
  <text class="body" x="62" y="226">Same commit. Same evidence.</text>
  <path class="arrow" d="M34 218V263"/>

  <text class="step" x="20" y="296">02</text>
  <text class="label" x="62" y="295">Pi plans. Sweeper fans out.</text>
  <text class="mono" x="62" y="325">23 or 238 workers</text>

  <path class="route" d="M34 315V703"/>
  <path class="arrow" d="M34 374H63"/>
  <path class="arrow" d="M34 548H63"/>

  <line class="rule" x1="62" y1="355" x2="370" y2="355"/>
  <text class="eyebrow" x="62" y="386">LOCAL / RTX 5090</text>
  <text class="label" x="62" y="421">Ollama</text>
  <text class="body" x="62" y="456">Laguna XS</text>
  <text class="muted" x="188" y="456">routine execution</text>
  <text class="body" x="62" y="487">Qwen 3.8 27B</text>
  <text class="muted" x="213" y="487">navigation + recon</text>

  <line class="rule" x1="62" y1="529" x2="370" y2="529"/>
  <text class="eyebrow" x="62" y="560">CLOUD / AFTER TRIAGE</text>
  <text class="label" x="62" y="595">Kimi K2.6</text>
  <text class="body" x="62" y="630">Hard puzzles only</text>
  <text class="muted" x="62" y="658">More weight when depth matters.</text>

  <path class="arrow" d="M34 703H63"/>
  <line class="rule" x1="62" y1="704" x2="370" y2="704"/>

  <text class="step" x="20" y="754">03</text>
  <text class="label" x="62" y="753">Prove the work</text>
  <text class="mono" x="62" y="786">lint  •  test  •  diff</text>
  <text class="body" x="62" y="826">A clean exit is not enough.</text>
  <text class="body" x="62" y="852">Only verified changes advance.</text>
  <line x1="62" y1="884" x2="370" y2="884" stroke="#f97316" stroke-width="4"/>
</svg>
