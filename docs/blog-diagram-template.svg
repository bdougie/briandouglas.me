<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <!-- Copy this file into public/images/blog and replace every bracketed label. -->
  <title id="title">[Describe the diagram]</title>
  <desc id="desc">[Explain the input, branching work, and verified result]</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f97316"/>
    </marker>
    <style>
      .canvas { fill: #000; }
      .rule { stroke: #374151; stroke-width: 1.5; }
      .route { fill: none; stroke: #f97316; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #f97316; stroke-width: 2.5; marker-end: url(#arrow); }
      .eyebrow { fill: #fb923c; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.2px; }
      .headline { fill: #fff; font: 600 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #fb923c; font: 600 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #fff; font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #d1d5db; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9ca3af; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #fb923c; font: 600 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect class="canvas" width="720" height="700"/>

  <text class="eyebrow" x="44" y="42">[TOPIC / DIAGRAM TYPE]</text>
  <text class="headline" x="44" y="82">[One clear conclusion.]</text>
  <text class="body" x="44" y="113">[One sentence of context.]</text>
  <line class="rule" x1="44" y1="139" x2="676" y2="139"/>

  <text class="step" x="44" y="190">01</text>
  <text class="label" x="96" y="188">[Known input]</text>
  <text class="body" x="96" y="217">[What every lane receives.]</text>
  <path class="arrow" d="M62 208V258"/>

  <text class="step" x="44" y="291">02</text>
  <text class="label" x="96" y="289">[Work fans out]</text>
  <text class="mono" x="676" y="289" text-anchor="end">[measured count]</text>
  <path class="route" d="M62 309V347H206V373"/>
  <path class="route" d="M62 347H514V373"/>
  <path d="M206 365V378" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M514 365V378" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line class="rule" x1="44" y1="390" x2="354" y2="390"/>
  <text class="eyebrow" x="44" y="421">[LANE ONE]</text>
  <text class="label" x="44" y="457">[Owner or tool]</text>
  <text class="body" x="44" y="491">[What this lane does]</text>
  <text class="muted" x="44" y="523">[Supporting detail]</text>

  <line class="rule" x1="386" y1="390" x2="676" y2="390"/>
  <text class="eyebrow" x="386" y="421">[LANE TWO]</text>
  <text class="label" x="386" y="457">[Owner or tool]</text>
  <text class="body" x="386" y="491">[What this lane does]</text>
  <text class="muted" x="386" y="523">[Supporting detail]</text>

  <path class="route" d="M206 544V579H360"/>
  <path class="route" d="M514 544V579H360"/>
  <path class="arrow" d="M360 579V618"/>

  <line class="rule" x1="44" y1="632" x2="676" y2="632"/>
  <text class="step" x="44" y="676">03</text>
  <text class="label" x="96" y="674">[Verified result]</text>
  <text class="mono" x="676" y="674" text-anchor="end">[checks]</text>
</svg>
