[build]
  command = "npm run build"
  publish = "dist"

# Keep static HTML publicly revalidatable. Netlify's social-crawler
# prerenderer rejects private/no-store responses before it can read OG tags.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Fingerprinted build assets can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Edge function for live Bluesky stats
[[edge_functions]]
  path = "/api/bluesky-stats"
  function = "bluesky-stats"
